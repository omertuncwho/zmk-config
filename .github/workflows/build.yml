name: Build ZMK firmware

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install west
        run: pip install west

      - name: Initialize west
        run: |
          west init -l config
          west update

      - name: Build firmware
        run: |
          west build -s zmk/app -b nice_nano -- -DSHIELD="lily58_left lily58_right"

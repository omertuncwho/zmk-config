name: Build ZMK firmware

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout config
        uses: actions/checkout@v4

      - name: Build ZMK firmware
        uses: zmkfirmware/zmk-build@v1
        with:
          board: nice_nano
          shield: lily58_left lily58_right

name: Build ZMK firmware

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout zmk-config
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install west
        run: pip install west

      - name: Initialize west workspace
        run: |
          west init -m https://github.com/zmkfirmware/zmk.git
          west update

      - name: Build firmware
        run: |
          west build -s zmk/app \
            -b nice_nano \
            -- \
            -DZMK_CONFIG=$GITHUB_WORKSPACE/config \
            -DSHIELD="lily58_left lily58_right"
